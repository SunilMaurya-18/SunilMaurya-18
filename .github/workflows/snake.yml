# Save as .github/workflows/snake.yml in the SunilMaurya-18/SunilMaurya-18 repo.
# Generates the contribution snake SVGs and pushes them to the `output` branch.
# Settings > Actions > General > Workflow permissions must allow "Read and write".
name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#E50914&color_dots=#ebedf0,#c6c6c6,#8c8c8c,#b20710,#e50914
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#E50914&color_dots=#161616,#3a3a3a,#6e6e6e,#b20710,#e50914

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
